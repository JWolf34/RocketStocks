name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v2-rewrite

jobs:
  v2:
    name: v2 (workspace members)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Pinned (not latest-pg16); bump deliberately, together with docker-compose.yml.
        image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
        env:
          POSTGRES_PASSWORD: t
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RS_TEST_DB_URL: postgresql+psycopg://postgres:t@localhost:5499/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace from lockfile
        run: uv sync --locked --all-packages

      - name: Lint v2 members
        run: uv run ruff check libs services tools

      - name: Type-check v2 members
        run: uv run mypy

      - name: Import-layer contracts
        run: uv run lint-imports

      - name: Clock-discipline gate
        run: scripts/check_clock_discipline.sh

      - name: Plan-citation gate
        run: scripts/check_plan_citations.sh

      # Hand-written migrations vs the ORM models: fails on any drift.
      - name: Migrations match models (alembic check)
        env:
          RS_DB_URL: postgresql+psycopg://postgres:t@localhost:5499/postgres
          # Exercises the per-service roles step that follows the upgrade.
          RS_DB_PASSWORD_INGEST: ci-password-ingest-0000
          RS_DB_PASSWORD_BOT: ci-password-bot-000000
          RS_DB_PASSWORD_MCP: ci-password-mcp-0000000
          RS_DB_PASSWORD_RESEARCH: ci-password-research-0
        run: |
          uv run python -m rs_migrate upgrade
          uv run python -m rs_migrate check

      # Per-member tests/test_import.py covers importability of every member.
      - name: Run v2 member tests
        run: uv run pytest libs/ services/ tools/ -q

  docker:
    name: docker (image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: compose smoke (db + migrate gate)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p rs-smoke -f docker-compose.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Throwaway credentials: only the database and the migrate gate start here.
      - name: Write a smoke .env
        run: |
          cat > .env <<'EOF'
          RS_DB_PASSWORD=ci-smoke-superuser-0000
          RS_DB_PASSWORD_INGEST=ci-password-ingest-0000
          RS_DB_PASSWORD_BOT=ci-password-bot-000000
          RS_DB_PASSWORD_MCP=ci-password-mcp-0000000
          RS_DB_PASSWORD_RESEARCH=ci-password-research-0
          RS_EDGAR_USER_AGENT=RocketStocks ci@example.com
          EOF

      - name: Validate compose config
        run: $COMPOSE config -q

      - name: Build the image
        run: $COMPOSE build migrate

      # Starts timescaledb, waits for its healthcheck, then upgrades and applies the roles.
      - name: Run the migrate gate
        run: $COMPOSE run --rm migrate

      - name: Schema is at head and matches the models
        run: |
          $COMPOSE run --rm --no-deps migrate python -m rs_migrate current
          $COMPOSE run --rm --no-deps migrate python -m rs_migrate check

      - name: Roles step is idempotent
        run: $COMPOSE run --rm --no-deps migrate python -m rs_migrate roles

      - name: Show logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
