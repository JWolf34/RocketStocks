name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v2-rewrite

jobs:
  legacy:
    name: legacy (v1 suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace from lockfile
        run: uv sync --locked --all-packages

      - name: Run v1 test suite from legacy/
        run: uv run pytest legacy/tests -q

  v2:
    name: v2 (workspace members)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Pinned (not latest-pg16); bump deliberately, together with docker-compose.v2.yml.
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_PASSWORD: t
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RS_TEST_DB_URL: postgresql+psycopg://postgres:t@localhost:5499/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # rocketstocks (legacy) excluded: the v2 members are dependency-free,
      # so skipping it avoids installing the full v1 scientific stack here.
      - name: Sync workspace from lockfile
        run: uv sync --locked --all-packages --no-install-package rocketstocks

      - name: Lint v2 members
        run: uv run ruff check libs services tools

      - name: Type-check v2 members
        run: uv run mypy

      - name: Import-layer contracts
        run: uv run lint-imports

      - name: Clock-discipline gate
        run: scripts/check_clock_discipline.sh

      # Hand-written migrations vs the ORM models: fails on any drift.
      - name: Migrations match models (alembic check)
        env:
          RS_DB_URL: postgresql+psycopg://postgres:t@localhost:5499/postgres
        run: |
          uv run python -m rs_migrate upgrade
          uv run python -m rs_migrate check

      # Per-member tests/test_import.py covers importability of every member.
      - name: Run v2 member tests
        run: uv run pytest libs/ services/ tools/ -q

  docker:
    name: docker (v1 + v2 images)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

      - name: Validate v2 compose config
        run: docker compose -f docker-compose.v2.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build v1 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Own cache scope so the two images never evict each other's layers.
      - name: Build v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.v2
          push: false
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2
