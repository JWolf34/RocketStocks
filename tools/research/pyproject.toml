[project]
name = "rs-research"
version = "0.1.0"
description = "RocketStocks v2 research CLI: event studies that write base rates"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.0",
    "pandas>=3.0",
    "sqlalchemy[asyncio]>=2",
    "rs-analysis",
    "rs-domain",
    "rs-observability",
    "rs-persistence",
    "rs-query",
    "rs-sources",
]

[dependency-groups]
# the tests apply the real service roles
dev = ["rs-migrate"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-analysis = { workspace = true }
rs-domain = { workspace = true }
rs-migrate = { workspace = true }
rs-observability = { workspace = true }
rs-persistence = { workspace = true }
rs-query = { workspace = true }
rs-sources = { workspace = true }
