[project]
name = "rs-backfill"
version = "0.1.0"
description = "RocketStocks v2 one-shot backfills (the v1 popularity import)"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rs-domain",
    "rs-persistence",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
rs-persistence = { workspace = true }
