[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*", "legacy"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.15.20",
    "time-machine>=3.2.0",
]

# Bare `pytest` from the root runs everything — legacy suite included, so a
# muscle-memory `pytest -q` after a v1 bugfix can never false-green on the
# 7 placeholder tests alone. `pytest legacy/tests` still resolves to
# legacy/pyproject.toml's own config (rootdir=legacy/).
# importlib mode lets same-named test files coexist across members.
[tool.pytest.ini_options]
testpaths = ["legacy/tests", "libs", "services", "tools"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
