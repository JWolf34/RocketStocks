[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[dependency-groups]
dev = [
    "httpx",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.15.20",
    "time-machine>=3.2.0",
]

# Bare `pytest` from the root runs every member's tests.
# importlib mode lets same-named test files coexist across members.
[tool.pytest.ini_options]
testpaths = ["libs", "services", "tools"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

# Type checking over every v2 member's src/ (tests are out of scope).
# The globs mean a new member is covered the moment its src/ exists.
[tool.mypy]
files = ["libs/*/src", "services/*/src", "tools/*/src"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries that ship no types and no stubs.
[[tool.mypy.overrides]]
module = ["schwab.*", "authlib.*", "exchange_calendars.*"]
ignore_missing_imports = true

# Ruff's defaults (E4, E7, E9, F) plus import sorting, pyupgrade and bugbear.
# CI lints libs, services and tools.
[tool.ruff]
# No directory-based first-party detection: a stray ./discord/ (the bot writes
# attachments there when run from the root) would otherwise reclassify discord.py.
src = []
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rs_*"]

# Architecture layer rules. Contracts name packages explicitly (import-linter
# fails on an unknown module), so a new member is one line in root_packages and
# one in each contract that should cover it.
[tool.importlinter]
root_packages = [
    "rs_analysis",
    "rs_backfill",
    "rs_bot",
    "rs_domain",
    "rs_ingest",
    "rs_migrate",
    "rs_observability",
    "rs_persistence",
    "rs_query",
    "rs_sources",
]

[[tool.importlinter.contracts]]
name = "rs_domain imports no other member"
type = "forbidden"
source_modules = ["rs_domain"]
forbidden_modules = [
    "rs_analysis",
    "rs_backfill",
    "rs_bot",
    "rs_ingest",
    "rs_migrate",
    "rs_observability",
    "rs_persistence",
    "rs_query",
    "rs_sources",
]

[[tool.importlinter.contracts]]
name = "rs_analysis imports only rs_domain"
type = "forbidden"
source_modules = ["rs_analysis"]
forbidden_modules = [
    "rs_backfill",
    "rs_bot",
    "rs_ingest",
    "rs_migrate",
    "rs_observability",
    "rs_persistence",
    "rs_query",
    "rs_sources",
]

[[tool.importlinter.contracts]]
name = "libs never import services or tools"
type = "forbidden"
source_modules = [
    "rs_analysis",
    "rs_domain",
    "rs_observability",
    "rs_persistence",
    "rs_query",
    "rs_sources",
]
forbidden_modules = ["rs_backfill", "rs_bot", "rs_ingest", "rs_migrate"]

[[tool.importlinter.contracts]]
name = "services never import each other"
type = "independence"
modules = ["rs_bot", "rs_ingest"]

[[tool.importlinter.contracts]]
name = "rs_bot never imports rs_sources"
type = "forbidden"
source_modules = ["rs_bot"]
forbidden_modules = ["rs_sources"]

[[tool.importlinter.contracts]]
name = "rs_query reads through rs_domain and rs_persistence only"
type = "forbidden"
source_modules = ["rs_query"]
forbidden_modules = [
    "rs_analysis",
    "rs_bot",
    "rs_ingest",
    "rs_migrate",
    "rs_observability",
    "rs_sources",
]
