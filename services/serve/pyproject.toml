[project]
name = "rs-serve"
version = "0.1.0"
description = "RocketStocks v2 serve service: authenticated read API (FastAPI)"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "rs-domain",
    "rs-observability",
    "rs-persistence",
    "sqlalchemy[asyncio]>=2",
    "starlette>=1.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
rs-observability = { workspace = true }
rs-persistence = { workspace = true }
