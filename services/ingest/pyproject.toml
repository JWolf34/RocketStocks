[project]
name = "rs-ingest"
version = "0.1.0"
description = "RocketStocks v2 ingest service: market-data streaming and persistence"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "schwab-py>=1.5.1",
    "authlib>=1.3",
    "pydantic-settings>=2.6.0",
    "rs-domain",
    "rs-persistence",
    "rs-sources",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
rs-persistence = { workspace = true }
rs-sources = { workspace = true }
