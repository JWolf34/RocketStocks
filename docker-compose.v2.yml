# v2 stack (S006): TimescaleDB + one-shot migrate gate + the three services,
# one shared image (Dockerfile.v2). Lifecycle fully independent of the v1
# stack (own project name, own volume, DB published on 5498) for burn-in
# coexistence; at cutover this file renames to docker-compose.yml.
#
# Interpolated from .env: RS_DB_PASSWORD (the superuser; migrate only, and the
# host-side RS_DB_URL in .env for local tools), RS_DB_PASSWORD_INGEST / _BOT /
# _SERVE / _RESEARCH (per-service roles, created by migrate; URL-safe because
# they are interpolated into DSNs unencoded), SCHWAB_API_KEY,
# SCHWAB_API_SECRET, RS_BOT_DISCORD_TOKEN, RS_BOT_ALERT_CHANNEL_ID.
#
# Metrics side-ports (9090 ingest, 9091 bot) and serve's 8000 are published
# 127.0.0.1-only: the operator scrapes/proxies from the host (ADR-0015; the
# TLS reverse proxy is serve's public face — ADR-0012). Not scraped in-compose.

name: rocketstocks-v2

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.v2
  image: rocketstocks-v2
  environment: &app-env
    RS_DB_URL: postgresql+psycopg://postgres:${RS_DB_PASSWORD}@timescaledb:5432/rocketstocks
    TZ: UTC
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  timescaledb:
    # Pinned (not latest-pg16); bump deliberately, together with .github/workflows/ci.yml.
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${RS_DB_PASSWORD}
      POSTGRES_DB: rocketstocks
      TZ: UTC
    volumes:
      - timescale_data:/var/lib/postgresql/data
    # Takes over the manual acceptance container's role on 5498 (prior data
    # disposable); host-side tools keep reaching it via .env's RS_DB_URL.
    ports:
      - "127.0.0.1:5498:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rocketstocks"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot gate: app services start only after the schema is at head.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.v2
    image: rocketstocks-v2
    command: ["python", "-m", "rs_migrate", "upgrade"]
    environment:
      <<: *app-env
      RS_DB_PASSWORD_INGEST: ${RS_DB_PASSWORD_INGEST}
      RS_DB_PASSWORD_BOT: ${RS_DB_PASSWORD_BOT}
      RS_DB_PASSWORD_SERVE: ${RS_DB_PASSWORD_SERVE}
      RS_DB_PASSWORD_RESEARCH: ${RS_DB_PASSWORD_RESEARCH}
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy

  ingest:
    <<: *app
    command: ["python", "-m", "rs_ingest"]
    # Multi-session daemon: the container restart policy backs up its own
    # supervisor, and the heartbeat healthcheck catches a hung (not crashed) loop.
    restart: unless-stopped
    # Must exceed RS_INGEST_SHUTDOWN_GRACE_SECONDS (30) so SIGTERM can drain.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "rs_ingest.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *app-env
      RS_DB_URL: postgresql+psycopg://rs_ingest:${RS_DB_PASSWORD_INGEST}@timescaledb:5432/rocketstocks
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      # The weekly base-rate job runs rs_research as a subprocess under its own
      # read-only role; the job passes this and nothing else of ingest's env.
      RS_RESEARCH_DB_URL: postgresql+psycopg://rs_research:${RS_DB_PASSWORD_RESEARCH}@timescaledb:5432/rocketstocks
      RS_EDGAR_USER_AGENT: ${RS_EDGAR_USER_AGENT}
    ports:
      - "127.0.0.1:9090:9090"

  serve:
    <<: *app
    command: ["python", "-m", "rs_serve"]
    # The container restart policy is the supervisor (S004/S005 stance).
    restart: unless-stopped
    environment:
      <<: *app-env
      RS_DB_URL: postgresql+psycopg://rs_serve:${RS_DB_PASSWORD_SERVE}@timescaledb:5432/rocketstocks
      # 0.0.0.0 in-container is deliberate (resolves the S005 host-binding
      # pointer): publishing stays 127.0.0.1-only, the TLS proxy fronts it.
      RS_SERVE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    <<: *app
    command: ["python", "-m", "rs_bot"]
    restart: unless-stopped
    environment:
      <<: *app-env
      RS_DB_URL: postgresql+psycopg://rs_bot:${RS_DB_PASSWORD_BOT}@timescaledb:5432/rocketstocks
      RS_BOT_DISCORD_TOKEN: ${RS_BOT_DISCORD_TOKEN}
      RS_BOT_ALERT_CHANNEL_ID: ${RS_BOT_ALERT_CHANNEL_ID}
      RS_OPS_WEBHOOK_URL: ${RS_OPS_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  timescale_data:
