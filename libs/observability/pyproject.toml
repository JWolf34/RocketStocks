[project]
name = "rs-observability"
version = "0.1.0"
description = "RocketStocks v2 observability: logging, metrics, and health"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "structlog",
    "prometheus-client",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
