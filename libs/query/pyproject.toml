[project]
name = "rs-query"
version = "0.1.0"
description = "RocketStocks v2 read layer: typed, capped, paginated async queries"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "rs-domain",
    "rs-persistence",
    "sqlalchemy[asyncio]>=2",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
rs-persistence = { workspace = true }
