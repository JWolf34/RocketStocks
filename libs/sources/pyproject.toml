[project]
name = "rs-sources"
version = "0.1.0"
description = "RocketStocks v2 market-data source adapters (Schwab, ApeWisdom, Nasdaq)"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas-market-calendars>=5.4.0",
    "httpx>=0.28",
    "rs-domain",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
