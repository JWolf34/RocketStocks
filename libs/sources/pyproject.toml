[project]
name = "rs-sources"
version = "0.1.0"
description = "RocketStocks v2 market-data source adapters (Schwab, ApeWisdom, Nasdaq)"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.3",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "rs-domain",
    "schwab-py>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
