[project]
name = "rs-analysis"
version = "0.1.0"
description = "RocketStocks v2 pure-math analysis: indicators, z-scores, flow metrics"
authors = [
    { name = "John Wolf", email = "johnmwolf34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "rs-domain",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-domain = { workspace = true }
