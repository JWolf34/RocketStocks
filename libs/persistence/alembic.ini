# Alembic config for rs_persistence. The DSN comes from RS_DB_URL (env.py);
# sqlalchemy.url here is a placeholder overridden at runtime.

[alembic]
script_location = %(here)s/src/rs_persistence/migrations
sqlalchemy.url = postgresql+psycopg://localhost/unset

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
